era5:
    class: WeatherBench2Raw
    batch_size: 1
    conf:
        name: era5
        path: 'swissai/weatherbench/weatherbench2_original'
        stats_path: 'esfm/normalization_stats_1979_2021.json'
        str_task: 6h-forecast
        atmos_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
